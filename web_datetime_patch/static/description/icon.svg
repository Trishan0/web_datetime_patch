<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#gradientBg)"/>
  
  <!-- Calendar base -->
  <rect x="48" y="44" width="96" height="104" fill="rgba(255,255,255,0.95)" rx="8"/>
  
  <!-- Calendar header -->
  <rect x="48" y="44" width="96" height="24" fill="url(#gradientAccent)" rx="8" ry="0"/>
  
  <!-- Calendar grid lines -->
  <line x1="48" y1="68" x2="144" y2="68" stroke="rgba(200,200,200,0.5)" stroke-width="1"/>
  <line x1="72" y1="44" x2="72" y2="148" stroke="rgba(200,200,200,0.3)" stroke-width="1"/>
  <line x1="96" y1="44" x2="96" y2="148" stroke="rgba(200,200,200,0.3)" stroke-width="1"/>
  <line x1="120" y1="44" x2="120" y2="148" stroke="rgba(200,200,200,0.3)" stroke-width="1"/>
  
  <!-- Calendar dates (small) -->
  <text x="60" y="82" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">1</text>
  <text x="84" y="82" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">2</text>
  <text x="108" y="82" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">3</text>
  <text x="132" y="82" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">4</text>
  
  <text x="60" y="102" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">5</text>
  <text x="84" y="102" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">6</text>
  <text x="108" y="102" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">7</text>
  <text x="132" y="102" font-size="10" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">8</text>
  
  <!-- Year badge - prominent -->
  <rect x="56" y="118" width="80" height="24" fill="url(#gradientBg)" rx="4"/>
  <text x="96" y="134" font-size="14" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">2024</text>
  
  <!-- Decorative corner circles -->
  <circle cx="156" cy="52" r="6" fill="url(#gradientAccent)" opacity="0.8"/>
  <circle cx="164" cy="140" r="5" fill="url(#gradientAccent)" opacity="0.6"/>
</svg>