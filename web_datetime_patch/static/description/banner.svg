<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="coverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="1200" height="600" fill="url(#coverGradient)"/>
  
  <!-- Decorative circles (background) -->
  <circle cx="-100" cy="150" r="250" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1300" cy="500" r="300" fill="rgba(255,255,255,0.06)"/>
  <circle cx="600" cy="800" r="200" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Big calendar icon on the left -->
  <g transform="translate(150, 100)">
    <!-- Calendar frame -->
    <rect x="0" y="0" width="180" height="240" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="3" rx="12"/>
    
    <!-- Calendar header -->
    <rect x="0" y="0" width="180" height="50" fill="rgba(255,255,255,0.2)" rx="12" ry="0"/>
    
    <!-- Calendar days header -->
    <text x="15" y="35" font-size="12" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">Mon</text>
    <text x="54" y="35" font-size="12" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">Tue</text>
    <text x="96" y="35" font-size="12" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">Wed</text>
    <text x="135" y="35" font-size="12" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">Thu</text>
    
    <!-- Grid lines -->
    <line x1="0" y1="60" x2="180" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="45" y1="0" x2="45" y2="240" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="240" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="135" y1="0" x2="135" y2="240" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Calendar dates (small, faded) -->
    <text x="15" y="85" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">1</text>
    <text x="60" y="85" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">2</text>
    <text x="105" y="85" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">3</text>
    <text x="150" y="85" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">4</text>
    
    <text x="15" y="125" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">8</text>
    <text x="60" y="125" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">9</text>
    <text x="105" y="125" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">10</text>
    <text x="150" y="125" font-size="11" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif">11</text>
    
    <!-- Year highlight box -->
    <rect x="20" y="170" width="140" height="50" fill="url(#accentGradient)" rx="6"/>
    <text x="90" y="210" font-size="32" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">2024</text>
  </g>
  
  <!-- Right side - text content -->
  <g transform="translate(450, 80)">
    <!-- Main title -->
    <text x="0" y="0" font-size="48" font-weight="800" fill="#ffffff" font-family="Arial, sans-serif" letter-spacing="1">
      Keep the Year
    </text>
    <text x="0" y="60" font-size="48" font-weight="800" fill="#ffffff" font-family="Arial, sans-serif" letter-spacing="1">
      Visible Always
    </text>
    
    <!-- Accent underline -->
    <rect x="0" y="75" width="120" height="4" fill="url(#accentGradient)"/>
    
    <!-- Description -->
    <text x="0" y="140" font-size="18" fill="rgba(255,255,255,0.95)" font-family="Arial, sans-serif" line-height="28">
      Web Datetime Year Patch ensures dates and
    </text>
    <text x="0" y="170" font-size="18" fill="rgba(255,255,255,0.95)" font-family="Arial, sans-serif">
      datetimes in Odoo always display the year,
    </text>
    <text x="0" y="200" font-size="18" fill="rgba(255,255,255,0.95)" font-family="Arial, sans-serif">
      regardless of locale or widget combination.
    </text>
    
    <!-- Three features -->
    <g transform="translate(0, 260)">
      <!-- Feature 1: Calendar -->
      <circle cx="30" cy="30" r="30" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="2"/>
      <text x="30" y="38" font-size="24" fill="#fbbf24" font-family="Arial, sans-serif" text-anchor="middle">📅</text>
      <text x="80" y="28" font-size="16" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">Always Visible</text>
      <text x="80" y="48" font-size="13" fill="rgba(255,255,255,0.85)" font-family="Arial, sans-serif">Year in all formats</text>
      
      <!-- Feature 2: Settings -->
      <circle cx="320" cy="30" r="30" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="2"/>
      <text x="320" y="38" font-size="24" fill="#ec4899" font-family="Arial, sans-serif" text-anchor="middle">⚙️</text>
      <text x="370" y="28" font-size="16" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">No Config</text>
      <text x="370" y="48" font-size="13" fill="rgba(255,255,255,0.85)" font-family="Arial, sans-serif">Works out of box</text>
      
      <!-- Feature 3: Lock -->
      <circle cx="610" cy="30" r="30" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="2"/>
      <text x="610" y="38" font-size="24" fill="#06b6d4" font-family="Arial, sans-serif" text-anchor="middle">🔒</text>
      <text x="660" y="28" font-size="16" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">Safe & Light</text>
      <text x="660" y="48" font-size="13" fill="rgba(255,255,255,0.85)" font-family="Arial, sans-serif">No data changes</text>
    </g>
  </g>
  
  <!-- Bottom badge -->
  <g transform="translate(450, 530)">
    <rect x="0" y="0" width="320" height="50" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="25"/>
    <circle cx="30" cy="25" r="14" fill="url(#accentGradient)"/>
    <text x="30" y="32" font-size="20" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">✓</text>
    <text x="60" y="35" font-size="16" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">Odoo 19.0 Compatible</text>
  </g>
</svg>